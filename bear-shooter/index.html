<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b3a">
<!--ARTIFACT-START-->
<title>ハニーベア・ストライク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --night: #1d2b3a;
    --ink: #2a1a10;
    --honey: #f6b21a;
    --honey-deep: #c98a0a;
    --cream: #fff4d6;
    --berry: #e8453c;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--night);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "DotGothic16", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color: var(--cream);
  }
  #game {
    position: fixed;
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 0 2px #0e1822, 0 12px 40px rgba(0, 0, 0, .45);
  }
  .btn {
    position: fixed;
    z-index: 5;
    font: inherit;
    color: var(--ink);
    border: 3px solid var(--ink);
    background: var(--cream);
    cursor: pointer;
    touch-action: none;
    display: none;
  }
  .btn:focus-visible { outline: 3px solid #9fe0ff; outline-offset: 2px; }
  .btn:active { transform: translateY(2px); }
  .small {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    height: 40px;
    min-width: 44px;
    padding: 0 10px;
    border-radius: 10px;
    font-size: 15px;
    box-shadow: 0 3px 0 var(--ink);
  }
  #pauseBtn { right: calc(env(safe-area-inset-right, 0px) + 10px); }
  #muteBtn { right: calc(env(safe-area-inset-right, 0px) + 64px); }
  #bombBtn {
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe28a, var(--honey) 55%, var(--honey-deep));
    box-shadow: 0 5px 0 var(--ink), 0 0 0 6px rgba(246, 178, 26, .25);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    line-height: 1.1;
    opacity: .92;
  }
  #bombBtn span { font-size: 16px; }
  #bombBtn b { font-size: 24px; font-weight: normal; }
  #bombBtn.empty { filter: grayscale(1); opacity: .5; }
  body.playing .btn { display: block; }
  body.playing #bombBtn { display: flex; }
  body.portrait #bombBtn { width: 104px; height: 104px; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
  #hint {
    position: fixed;
    left: 16px;
    right: 16px;
    margin: 0;
    text-align: center;
    font-size: 15px;
    line-height: 1.7;
    color: #b9c9d6;
    display: none;
    pointer-events: none;
  }
  #hint strong { color: var(--honey); font-weight: normal; }
  body.portrait #hint { display: block; }
  @media (prefers-reduced-motion: reduce) {
    .btn:active { transform: none; }
  }
</style>
</head>
<body>

<canvas id="game" aria-label="ハニーベア・ストライク ゲーム画面"></canvas>
<button id="muteBtn" class="btn small" type="button" aria-label="サウンド切り替え">音 ON</button>
<button id="pauseBtn" class="btn small" type="button" aria-label="一時停止">II</button>
<button id="bombBtn" class="btn" type="button" aria-label="はちみつボム"><span>ボム</span><b id="bombN">3</b></button>
<p id="hint">この下の広いところを<strong>指でなぞって</strong>くまを動かそう<br>ショットは自動。ピンチの時は<strong>ボム</strong>！<br>横向きにすると画面が大きくなります</p>

<script>
(() => {
'use strict';

// ===== 基本設定 =====
const W = 640, H = 360, GROUND = H - 30;
const BOSS_AT = 73.5, BOSS_HP = 650;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const bombBtn = document.getElementById('bombBtn');
const bombN = document.getElementById('bombN');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn = document.getElementById('muteBtn');
const hint = document.getElementById('hint');

let view = { scale: 1, left: 0, top: 0, cw: W, ch: H, dpr: 1 };

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw * 1.05;
  const availH = portrait ? vh * 0.5 : vh;
  const scale = Math.min(vw / W, availH / H);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  const left = Math.floor((vw - cw) / 2);
  const top = portrait ? Math.max(60, Math.floor((vh - ch) * 0.22)) : Math.floor((vh - ch) / 2);
  cv.style.left = left + 'px';
  cv.style.top = top + 'px';
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  view = { scale, left, top, cw, ch, dpr };
  document.body.classList.toggle('portrait', portrait);
  hint.style.top = (top + ch + 18) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ===== ユーティリティ =====
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;
let FL = false; // 被弾フラッシュ中は白で描く
const C = c => FL ? '#ffffff' : c;

function circ(x, y, r, c) { if (c) ctx.fillStyle = C(c); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { if (c) ctx.fillStyle = C(c); ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); ctx.fill(); }
function tri(a, b, c, d, e, f, col) { if (col) ctx.fillStyle = C(col); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(s, x, y, size, fill, align = 'left', stroke = '#2a1a10', lw = 4) {
  ctx.font = `${size}px "DotGothic16", "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(s, x, y);
}
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; }

// ===== ハイスコア =====
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('honeybear-hi') || '0', 10) || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('honeybear-hi', String(hiScore)); } catch (e) {} }

// ===== サウンド =====
const AU = { ac: null, master: null, muted: false, noise: null };
function audioInit() {
  if (AU.ac) { if (AU.ac.state === 'suspended' && state !== 'pause') AU.ac.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ac = new AC();
    AU.master = AU.ac.createGain();
    AU.master.gain.value = AU.muted ? 0 : 0.55;
    AU.master.connect(AU.ac.destination);
    const len = AU.ac.sampleRate * 0.6;
    AU.noise = AU.ac.createBuffer(1, len, AU.ac.sampleRate);
    const d = AU.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (mus.song) mus.next = AU.ac.currentTime + 0.05;
  } catch (e) { AU.ac = null; }
}
function tone(f, t0, dur, type = 'square', vol = 0.1, slide = 0) {
  const ac = AU.ac; if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AU.master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(t0, dur, vol, freq = 1500) {
  const ac = AU.ac; if (!ac || !AU.noise) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = AU.noise;
  f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AU.master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
const now = () => AU.ac ? AU.ac.currentTime : 0;
let lastHitSfx = 0;
const sfx = {
  shot() { tone(880, now(), 0.05, 'square', 0.018, 0.6); },
  hit() { const t = now(); if (t - lastHitSfx < 0.05) return; lastHitSfx = t; tone(300, t, 0.04, 'square', 0.03, 0.5); },
  boom(big) { const t = now(); noise(t, big ? 0.7 : 0.3, big ? 0.35 : 0.18, big ? 900 : 1800); tone(big ? 110 : 180, t, big ? 0.5 : 0.2, 'triangle', 0.2, 0.3); },
  power() { const t = now(); [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * 0.06, 0.12, 'square', 0.06)); },
  heart() { const t = now(); [76, 81, 88].forEach((m, i) => tone(mtof(m), t + i * 0.08, 0.18, 'triangle', 0.12)); },
  bomb() { const t = now(); noise(t, 1.2, 0.35, 700); tone(400, t, 1.0, 'sawtooth', 0.12, 0.1); },
  die() { const t = now(); noise(t, 0.9, 0.4, 1200); tone(520, t, 0.8, 'square', 0.1, 0.15); },
  warn() { const t = now(); for (let i = 0; i < 4; i++) { tone(440, t + i * 0.7, 0.3, 'sawtooth', 0.08); tone(330, t + i * 0.7 + 0.32, 0.3, 'sawtooth', 0.08); } },
  eshot() { tone(620, now(), 0.08, 'triangle', 0.04, 1.6); },
  clear() { const t = now(); [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => tone(mtof(m), t + i * 0.12, 0.22, 'square', 0.07)); },
};

// BGM：小さなチップチューン・シーケンサー
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SONGS = {
  stage: { bpm: 144, roots: [48, 43, 45, 41],
    mel: [72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 71, 0, 74, 0, 79, 0, 76, 0, 72, 0, 69, 0, 72, 76, 77, 0, 76, 0, 74, 0, 72, 0] },
  boss: { bpm: 168, roots: [45, 41, 43, 40],
    mel: [69, 72, 76, 72, 69, 72, 76, 81, 77, 72, 69, 72, 77, 72, 69, 65, 67, 71, 74, 71, 67, 71, 74, 79, 76, 71, 68, 71, 76, 0, 80, 0] },
  title: { bpm: 112, roots: [48, 45, 41, 43],
    mel: [79, 0, 0, 76, 0, 0, 72, 0, 76, 0, 0, 72, 0, 0, 69, 0, 77, 0, 0, 76, 0, 0, 74, 0, 72, 0, 74, 0, 76, 0, 0, 0] },
};
const mus = { song: null, step: 0, next: 0 };
function setMusic(name) { mus.song = name ? SONGS[name] : null; mus.step = 0; if (AU.ac) mus.next = AU.ac.currentTime + 0.05; }
setInterval(() => {
  const ac = AU.ac;
  if (!ac || !mus.song || ac.state !== 'running') return;
  const sd = 60 / mus.song.bpm / 4;
  if (mus.next < ac.currentTime) mus.next = ac.currentTime + 0.02;
  while (mus.next < ac.currentTime + 0.12) {
    const i = mus.step % 32, t = mus.next, S = mus.song;
    const root = S.roots[Math.floor(i / 8)];
    if (i % 2 === 0) tone(mtof(root + (i % 4 === 2 ? 12 : 0)), t, sd * 1.7, 'triangle', 0.1);
    if (S.mel[i]) tone(mtof(S.mel[i]), t, sd * 1.8, 'square', 0.03);
    if (i % 2 === 1) noise(t, 0.03, 0.02, 6000);
    mus.step++; mus.next += sd;
  }
}, 30);

// ===== 入力 =====
const keys = {};
let drag = null;
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
  audioInit();
  const k = e.key.toLowerCase();
  if (k === 'x' || k === 'b') doBomb();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'enter' || k === ' ' || k === 'z') tapAction();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function controllable() { const p = G && G.player; return state === 'play' && p && p.dead <= 0 && p.entering <= 0 && !G.outro; }

window.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.btn')) return;
  audioInit();
  if (state !== 'play') { tapAction(); return; }
  if (!drag) drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: G.player.x, py: G.player.y };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play') return;
  const p = G.player;
  if (!controllable()) { drag.sx = e.clientX; drag.sy = e.clientY; drag.px = p.x; drag.py = p.y; return; }
  const k = 1.35 / view.scale;
  const nx = drag.px + (e.clientX - drag.sx) * k;
  const ny = drag.py + (e.clientY - drag.sy) * k;
  const cx = clamp(nx, 16, W - 34), cy = clamp(ny, 18, GROUND - 8);
  // 画面端でめり込んだ分は基準点をずらして、戻す時にすぐ反応させる
  if (cx !== nx) { drag.px = cx; drag.sx = e.clientX; }
  if (cy !== ny) { drag.py = cy; drag.sy = e.clientY; }
  p.x = cx; p.y = cy;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

bombBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audioInit(); doBomb(); });
pauseBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); togglePause(); });
muteBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); audioInit();
  AU.muted = !AU.muted;
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.55;
  muteBtn.textContent = AU.muted ? '音 OFF' : '音 ON';
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

// ===== ゲーム状態 =====
let state = 'title'; // title | play | pause | over | clear
let G = null;
let titleT = 0;
let endT = 0;

function newGame() {
  G = {
    t: 0, score: 0, scroll: 0, tl: 0,
    player: { x: -30, y: H / 2, lives: 3, bombs: 3, power: 1, inv: 3, fire: 0, dead: 0, entering: 1.0, tilt: 0, ly: H / 2, shotN: 0, misses: 0 },
    shots: [], enemies: [], eb: [], items: [], parts: [], pops: [],
    boss: null, shake: 0, flash: 0, bombFx: 0, warn: 0, outro: 0, bonus: null, newHi: false,
  };
  drag = null;
}

function tapAction() {
  if (state === 'title') {
    newGame(); state = 'play'; setMusic('stage');
    document.body.classList.add('playing');
    updateBombBtn();
  } else if (state === 'pause') {
    togglePause();
  } else if ((state === 'over' || state === 'clear') && endT > 1.2) {
    state = 'title'; titleT = 0; setMusic('title');
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'pause'; drag = null;
    pauseBtn.textContent = '▶';
    if (AU.ac) AU.ac.suspend();
  } else if (state === 'pause') {
    state = 'play';
    pauseBtn.textContent = 'II';
    if (AU.ac) AU.ac.resume();
  }
}

function updateBombBtn() {
  if (!G) return;
  bombN.textContent = G.player.bombs;
  bombBtn.classList.toggle('empty', G.player.bombs <= 0);
}

// ===== ステージ構成（秒） =====
const TL = [];
const at = (t, f) => TL.push([t, f]);
function E(type, x, y, o = {}) {
  const d = DEF[type];
  const e = Object.assign({ type, x, y, t: 0, hp: d.hp, r: d.r, score: d.score, flash: 0 }, o);
  G.enemies.push(e);
  return e;
}
const DEF = {
  bee: { hp: 3, r: 12, score: 100 },
  crow: { hp: 4, r: 13, score: 150 },
  hog: { hp: 7, r: 14, score: 200 },
  hive: { hp: 30, r: 22, score: 500 },
  hornet: { hp: 45, r: 22, score: 1000 },
};
function beeLine(y, n, o = {}) {
  for (let i = 0; i < n; i++) E('bee', W + 30 + i * 38, y, { by: y, amp: o.amp ?? 18, f: o.f ?? 3, ph: i * 0.6, vx: o.vx ?? -130, shooter: Math.random() < 0.4, next: rnd(1, 3) });
}
function beeV(y) {
  [0, 1, -1, 2, -2].forEach(o => E('bee', W + 30 + Math.abs(o) * 34, y + o * 26, { by: y + o * 26, amp: 6, f: 2, ph: 0, vx: -150, shooter: o === 0, next: rnd(0.8, 1.5) }));
}
function crows(n) { for (let i = 0; i < n; i++) E('crow', W + 30 + i * 55, rnd(40, GROUND - 60), { vx: -250, vy: 0 }); }
function hogs(n) { for (let i = 0; i < n; i++) E('hog', W + 30 + i * 80, GROUND - 12, { next: rnd(0.8, 1.6) }); }
function hive(y, drop = 'P') { E('hive', W + 40, y, { by: y, drop }); }
function hornet(y, drop = null, tx = 500) { E('hornet', W + 50, y, { ty: y, tx, drop, mode: 0 }); }

at(1.5, () => beeLine(90, 5));
at(4.5, () => beeLine(250, 5));
at(7.5, () => beeLine(160, 5, { amp: 55, f: 2 }));
at(10, () => hive(170, 'P'));
at(13, () => crows(3));
at(15.5, () => hogs(2));
at(17, () => beeV(120));
at(19.5, () => beeV(240));
at(22, () => crows(4));
at(24, () => hornet(150, 'B'));
at(28.5, () => { beeLine(70, 5); beeLine(270, 5); });
at(31.5, () => { hogs(3); hive(110, 'P'); });
at(35, () => { hornet(90, 'P', 520); hornet(250, null, 470); });
at(40, () => crows(6));
at(42.5, () => beeLine(180, 7, { amp: 80, f: 1.6 }));
at(45.5, () => hive(200, 'L'));
at(48, () => { hornet(180, 'B'); beeLine(60, 4); beeLine(290, 4); });
at(53, () => { hogs(3); crows(3); });
at(56, () => { beeV(100); beeV(260); });
at(59, () => { hornet(110, 'P', 520); hornet(240, null, 470); hive(175, 'B'); });
at(64, () => crows(7));
at(67, () => beeLine(180, 8, { amp: 100, f: 1.4 }));
at(70, () => { G.warn = 3.4; setMusic(null); sfx.warn(); });
at(BOSS_AT, spawnBoss);
TL.sort((a, b) => a[0] - b[0]);

// ===== 弾 =====
function eShoot(x, y, a, spd, r = 5, kind = 'pink') {
  if (G.eb.length > 260) return;
  G.eb.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, kind, t: 0 });
}
function aimAt(x, y) { const p = G.player; return Math.atan2(p.y - y, p.x - x); }
function fan(x, y, n, spread, spd, r = 5, kind = 'pink') {
  const base = aimAt(x, y);
  for (let i = 0; i < n; i++) eShoot(x, y, base + (i - (n - 1) / 2) * spread, spd, r, kind);
}
function ring(x, y, n, spd, off = 0) { for (let i = 0; i < n; i++) eShoot(x, y, off + i * TAU / n, spd, 5, 'violet'); }

function firePlayer() {
  const p = G.player, x = p.x + 28, y = p.y + 4, s = 540;
  const add = (dy, a) => G.shots.push({ x, y: y + dy, vx: Math.cos(a) * s, vy: Math.sin(a) * s });
  if (p.power === 1) add(0, 0);
  else { add(-5, 0); add(5, 0); }
  if (p.power >= 3) { add(-3, -0.12); add(3, 0.12); }
  if (p.power >= 4) { add(0, 0); add(-4, -0.26); add(4, 0.26); }
  if (++p.shotN % 2 === 0) sfx.shot();
}

// ===== エフェクト =====
function explode(x, y, size = 14, cols = ['#fff4d6', '#ffd23f', '#f6b21a', '#e8453c']) {
  const n = Math.round(size * 1.2);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(30, size * 11);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.7), max: 0.7, size: rnd(1.5, size * 0.28), c: cols[i % cols.length], k: 'spark' });
  }
  for (let i = 0; i < size / 5; i++) G.parts.push({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-30, 10), vy: rnd(-40, -10), life: rnd(0.5, 0.9), max: 0.9, size: rnd(size * 0.3, size * 0.6), c: '#8d8a93', k: 'smoke' });
  G.parts.push({ x, y, vx: 0, vy: 0, life: 0.35, max: 0.35, size: size * 2.4, c: '#fff4d6', k: 'ring' });
}
function spark(x, y, c = '#fff4d6') {
  for (let i = 0; i < 3; i++) { const a = rnd(0, TAU), v = rnd(40, 140); G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.18, max: 0.18, size: 1.8, c, k: 'spark' }); }
}
function pop(x, y, s, c = '#fff4d6') { G.pops.push({ x, y, s: String(s), t: 0, c }); }
function addScore(n) { G.score += n; }

// ===== ゲームイベント =====
function hurtEnemy(e, d) {
  if (e.hp <= 0) return;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.hp = 0; e.dead = true;
  addScore(e.score);
  pop(e.x, e.y - 10, e.score);
  explode(e.x, e.y, e.type === 'hornet' || e.type === 'hive' ? 26 : 14);
  sfx.boom(e.type === 'hornet' || e.type === 'hive');
  if (e.drop) G.items.push({ type: e.drop, x: e.x, y: e.y, t: 0 });
  if (e.type === 'hornet' || e.type === 'hive') G.shake = Math.max(G.shake, 0.25);
}
function playerHit() {
  const p = G.player;
  if (p.inv > 0 || p.dead > 0 || p.entering > 0 || G.outro) return;
  explode(p.x, p.y, 30, ['#fff4d6', '#e8453c', '#8a5a3b', '#ffd23f']);
  sfx.die();
  G.shake = 0.5; G.flash = 0.25;
  p.lives--; p.misses++;
  p.power = Math.max(1, p.power - 1);
  p.dead = 1.3;
  drag = null;
  if (p.lives > 0) p.bombs = Math.max(p.bombs, 2);
  updateBombBtn();
}
function doBomb() {
  if (state !== 'play') return;
  const p = G.player;
  if (p.bombs <= 0 || p.dead > 0 || G.bombFx > 0.6 || G.outro) return;
  p.bombs--;
  updateBombBtn();
  G.bombFx = 1.2; G.flash = 0.35; G.shake = 0.4;
  p.inv = Math.max(p.inv, 2.0);
  sfx.bomb();
  for (const b of G.eb) { G.parts.push({ x: b.x, y: b.y, vx: 0, vy: -40, life: 0.5, max: 0.5, size: 3, c: '#ffd23f', k: 'spark' }); addScore(10); }
  G.eb.length = 0;
  for (const e of G.enemies) hurtEnemy(e, 30);
  const b = G.boss;
  if (b && b.mode === 'fight') { b.hp -= 25; b.flash = 0.2; if (b.hp <= 0) bossDown(); }
}
function collect(it) {
  const p = G.player;
  if (it.type === 'P') {
    if (p.power < 4) { p.power++; pop(it.x, it.y - 12, p.power === 4 ? 'MAX POWER!' : 'POWER UP!', '#ffd23f'); }
    else { addScore(1000); pop(it.x, it.y - 12, 1000, '#ffd23f'); }
    sfx.power();
  } else if (it.type === 'B') {
    p.bombs = Math.min(5, p.bombs + 1); updateBombBtn();
    pop(it.x, it.y - 12, 'BOMB +1', '#ffd23f'); sfx.power();
  } else if (it.type === 'L') {
    p.lives = Math.min(5, p.lives + 1);
    pop(it.x, it.y - 12, '1UP!', '#ff8fb1'); sfx.heart();
  }
}

// ===== ボス：クイーン・ホーネット =====
const PATS = [
  ['fan', 'summon', 'fan', 'ring'],
  ['spiral', 'fan', 'summon', 'ring'],
  ['spiral', 'charge', 'fan', 'summon', 'ring', 'charge'],
];
function spawnBoss() {
  G.boss = { x: W + 130, y: H / 2 - 10, hp: BOSS_HP, max: BOSS_HP, t: 0, mode: 'enter', pat: null, cool: 1, pi: 0, flash: 0, ph: 0, dt: 0 };
  setMusic('boss');
}
function bossDown() {
  const b = G.boss;
  if (b.mode === 'dying') return;
  b.mode = 'dying'; b.dt = 0; b.pat = null;
  addScore(20000);
  pop(b.x, b.y - 50, 20000, '#ffd23f');
  for (const e of G.enemies) if (!e.dead) killEnemy(e);
  for (const x of G.eb) spark(x.x, x.y, '#ffd23f');
  G.eb.length = 0;
  setMusic(null);
}
function updBoss(dt) {
  const b = G.boss, p = G.player;
  b.t += dt; b.flash -= dt;
  if (b.mode === 'enter') {
    b.x += (500 - b.x) * Math.min(1, dt * 1.4);
    b.y = H / 2 - 10 + Math.sin(b.t * 1.2) * 20;
    if (b.t > 2.8) b.mode = 'fight';
    return;
  }
  if (b.mode === 'dying') {
    b.dt += dt;
    b.y += 18 * dt;
    if (Math.random() < dt * 16) { explode(b.x + rnd(-50, 50), b.y + rnd(-35, 35), rnd(12, 24)); sfx.boom(false); }
    G.shake = Math.max(G.shake, 0.15);
    if (b.dt > 2.6) {
      explode(b.x, b.y, 70, ['#fff4d6', '#ffd23f', '#f08a1c', '#e8453c']);
      sfx.boom(true);
      G.flash = 0.6; G.shake = 0.8;
      G.boss = null;
      G.outro = 0.001;
      sfx.clear();
    }
    return;
  }
  const ph = b.hp > b.max * 0.66 ? 0 : b.hp > b.max * 0.33 ? 1 : 2;
  if (ph !== b.ph) { b.ph = ph; b.pi = 0; G.flash = 0.2; sfx.warn(); }
  const hover = () => {
    b.y += ((H / 2 - 10 + Math.sin(b.t * 0.9) * 95) - b.y) * Math.min(1, dt * 2);
    b.x += (500 + Math.sin(b.t * 0.5) * 30 - b.x) * Math.min(1, dt * 2);
  };
  if (!b.pat) {
    hover();
    b.cool -= dt;
    if (b.cool <= 0) { const L = PATS[ph]; b.pat = { n: L[b.pi++ % L.length], t: 0, k: 0, acc: 0 }; }
    return;
  }
  const P = b.pat;
  P.t += dt;
  const end = () => { b.pat = null; b.cool = [0.8, 0.55, 0.35][ph]; };
  const mx = b.x - 44, my = b.y - 4; // 口の位置
  switch (P.n) {
    case 'fan': {
      hover();
      const times = ph === 0 ? 3 : 4;
      while (P.k < times && P.t >= P.k * 0.45) { fan(mx, my, ph === 2 ? 9 : 7, 0.17, 160 + ph * 15); P.k++; sfx.eshot(); }
      if (P.t > times * 0.45 + 0.5) end();
      break;
    }
    case 'ring': {
      hover();
      const times = ph === 2 ? 3 : 2;
      while (P.k < times && P.t >= P.k * 0.55) { ring(b.x, b.y, 16 + ph * 4, 115 + ph * 10, P.k * 0.2); P.k++; sfx.eshot(); }
      if (P.t > times * 0.55 + 0.6) end();
      break;
    }
    case 'spiral': {
      hover();
      const dur = 2.8, arms = ph === 2 ? 3 : 2;
      P.acc += dt;
      while (P.acc > 0.08 && P.t < dur) {
        P.acc -= 0.08;
        for (let i = 0; i < arms; i++) eShoot(b.x - 10, b.y, P.t * 3.1 + i * TAU / arms, 125, 5, 'violet');
      }
      if (P.t > dur + 0.4) end();
      break;
    }
    case 'summon': {
      hover();
      if (P.k === 0) {
        for (let i = -1; i <= 1; i++) E('bee', b.x - 30, b.y + i * 40, { by: b.y + i * 55, amp: 30, f: 3, ph: i, vx: -170, shooter: false });
        P.k = 1;
      }
      if (P.k === 1 && P.t > 0.7) { eShoot(mx, my, aimAt(mx, my), 290, 7, 'sting'); P.k = 2; sfx.eshot(); }
      if (P.t > 1.4) end();
      break;
    }
    case 'charge': {
      if (P.k === 0) { P.cy = clamp(p.y, 50, GROUND - 50); P.k = 1; sfx.warn(); }
      if (P.k === 1) {
        b.y += (P.cy - b.y) * Math.min(1, dt * 5);
        b.x += (540 - b.x) * Math.min(1, dt * 4) + rnd(-1.5, 1.5);
        if (P.t > 1.1) { P.k = 2; }
      } else if (P.k === 2) {
        b.x -= 760 * dt;
        if (Math.random() < dt * 20) G.parts.push({ x: b.x + 60, y: b.y + rnd(-20, 20), vx: 60, vy: 0, life: 0.3, max: 0.3, size: 4, c: '#fff4d6', k: 'spark' });
        if (b.x < -140) { b.x = W + 140; b.y = H / 2 - 10; P.k = 3; }
      } else {
        b.x += (500 - b.x) * Math.min(1, dt * 2.2);
        if (Math.abs(b.x - 500) < 6) end();
      }
      break;
    }
  }
}

// ===== 更新 =====
function update(dt) {
  G.t += dt;
  G.scroll += 90 * dt;
  G.shake = Math.max(0, G.shake - dt);
  G.flash = Math.max(0, G.flash - dt);
  G.bombFx = Math.max(0, G.bombFx - dt);
  G.warn = Math.max(0, G.warn - dt);

  while (G.tl < TL.length && G.t >= TL[G.tl][0]) { TL[G.tl][1](); G.tl++; }

  // プレイヤー
  const p = G.player;
  if (p.dead > 0) {
    p.dead -= dt;
    if (p.dead <= 0) {
      if (p.lives <= 0) { gameOver(); return; }
      p.x = -30; p.y = H / 2; p.entering = 0.9; p.inv = 3;
    }
  } else if (G.outro > 0) {
    G.outro += dt;
    if (G.outro > 1.2) { p.x += (G.outro - 1.2) * 900 * dt; p.y += (H / 2 - p.y) * dt * 2; }
    else { p.y += (H / 2 - 20 - p.y) * dt * 2; }
    if (G.outro > 3.2) { stageClear(); return; }
  } else if (p.entering > 0) {
    p.entering -= dt;
    p.x += (110 - p.x) * Math.min(1, dt * 5);
  } else {
    let dx = 0, dy = 0;
    if (keys.arrowleft || keys.a) dx -= 1;
    if (keys.arrowright || keys.d) dx += 1;
    if (keys.arrowup || keys.w) dy -= 1;
    if (keys.arrowdown || keys.s) dy += 1;
    if (dx || dy) {
      const l = Math.hypot(dx, dy);
      p.x = clamp(p.x + dx / l * 230 * dt, 16, W - 34);
      p.y = clamp(p.y + dy / l * 230 * dt, 18, GROUND - 8);
    }
  }
  if (p.dead <= 0) {
    p.inv -= dt;
    const vy = (p.y - p.ly) / Math.max(dt, 0.001);
    p.tilt += (clamp(vy / 300, -1, 1) - p.tilt) * Math.min(1, dt * 10);
    p.ly = p.y;
    if (!G.outro && p.entering <= 0.5) {
      p.fire -= dt;
      if (p.fire <= 0) { firePlayer(); p.fire = p.power >= 4 ? 0.075 : 0.09; }
    }
  }

  // 自機ショット
  for (const s of G.shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  G.shots = G.shots.filter(s => !s.dead && s.x < W + 20 && s.y > -20 && s.y < H + 20);

  // 敵
  for (const e of G.enemies) {
    e.t += dt; e.flash -= dt;
    updEnemy(e, dt);
  }
  G.enemies = G.enemies.filter(e => !e.dead && e.x > -90 && e.x < W + 200 && e.y > -90 && e.y < H + 90);

  if (G.boss) updBoss(dt);

  // 敵弾
  for (const b of G.eb) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; }
  G.eb = G.eb.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20 && !b.dead);

  // アイテム
  for (const it of G.items) {
    it.t += dt;
    const dx = p.x - it.x, dy = p.y - it.y, d = Math.hypot(dx, dy);
    if (p.dead <= 0 && d < 80) { it.x += dx / d * 260 * dt; it.y += dy / d * 260 * dt; }
    else { it.x -= 50 * dt; it.y += Math.sin(it.t * 3) * 20 * dt; }
    if (p.dead <= 0 && d < 20) { it.got = true; collect(it); }
  }
  G.items = G.items.filter(it => !it.got && it.x > -30);

  // 当たり判定：ショット → 敵
  for (const s of G.shots) {
    for (const e of G.enemies) {
      if (e.dead) continue;
      const dx = s.x - e.x, dy = s.y - e.y;
      if (dx * dx + dy * dy < (e.r + 4) ** 2) { s.dead = true; hurtEnemy(e, 1); spark(s.x, s.y, '#ffd23f'); sfx.hit(); break; }
    }
    const b = G.boss;
    if (!s.dead && b && b.mode !== 'dying') {
      const dx = (s.x - b.x) / 58, dy = (s.y - b.y) / 36;
      if (dx * dx + dy * dy < 1) {
        s.dead = true;
        spark(s.x, s.y, b.mode === 'fight' ? '#ffd23f' : '#9fe0ff');
        if (b.mode === 'fight') { b.hp -= 1; b.flash = 0.05; addScore(10); sfx.hit(); if (b.hp <= 0) bossDown(); }
      }
    }
  }
  // 当たり判定：敵・敵弾 → 自機
  if (p.dead <= 0 && p.inv <= 0 && p.entering <= 0 && !G.outro) {
    for (const b of G.eb) {
      const dx = b.x - p.x, dy = b.y - p.y;
      if (dx * dx + dy * dy < (b.r * 0.75 + 3) ** 2) { b.dead = true; playerHit(); break; }
    }
    if (p.dead <= 0) for (const e of G.enemies) {
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx * dx + dy * dy < (e.r * 0.7 + 4) ** 2) { hurtEnemy(e, 10); playerHit(); break; }
    }
    const b = G.boss;
    if (p.dead <= 0 && b && b.mode !== 'dying') {
      const dx = (p.x - b.x) / 50, dy = (p.y - b.y) / 30;
      if (dx * dx + dy * dy < 1) playerHit();
    }
  }

  // パーティクル
  for (const q of G.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const q of G.pops) { q.t += dt; q.y -= 24 * dt; }
  G.pops = G.pops.filter(q => q.t < 1);
}

function updEnemy(e, dt) {
  const p = G.player;
  switch (e.type) {
    case 'bee':
      e.x += e.vx * dt;
      e.y = e.by + Math.sin(e.t * e.f + e.ph) * e.amp;
      if (e.shooter && e.t > e.next && e.x < W - 20 && e.x > 120) { eShoot(e.x - 10, e.y, aimAt(e.x, e.y), 135); e.next += rnd(2.2, 3.8); }
      break;
    case 'crow':
      if (e.x > p.x + 40) { e.vy += Math.sign(p.y - e.y) * 320 * dt; e.vy = clamp(e.vy, -130, 130); }
      e.x += e.vx * dt; e.y += e.vy * dt;
      break;
    case 'hog':
      e.x -= 115 * dt;
      if (e.t > e.next && e.x < W - 30 && e.x > 80) { fan(e.x - 6, e.y - 12, 3, 0.16, 140); e.next += 2.4; sfx.eshot(); }
      break;
    case 'hive':
      e.x -= 42 * dt;
      e.y = e.by + Math.sin(e.t * 1.6) * 14;
      break;
    case 'hornet':
      if (e.mode === 0) {
        e.x += (e.tx - e.x) * Math.min(1, dt * 2.2);
        e.y = e.ty + Math.sin(e.t * 2) * 10;
        if (Math.abs(e.x - e.tx) < 4) { e.mode = 1; e.mt = 0; e.shotT = 0.3; }
      } else if (e.mode === 1) {
        e.mt += dt;
        e.y = e.ty + Math.sin(e.t * 2) * 16;
        e.shotT -= dt;
        if (e.shotT <= 0) { fan(e.x - 20, e.y, 5, 0.22, 150); e.shotT = 1.5; sfx.eshot(); }
        if (e.mt > 5.5) e.mode = 2;
      } else { e.x -= 230 * dt; e.y -= 40 * dt; }
      break;
  }
}

function gameOver() {
  state = 'over'; endT = 0;
  G.player.dead = 999;
  document.body.classList.remove('playing');
  setMusic(null);
  if (G.score > hiScore) { hiScore = G.score; G.newHi = true; saveHi(); }
}
function stageClear() {
  const p = G.player;
  const lifeB = p.lives * 5000, bombB = p.bombs * 2000, noMiss = p.misses === 0 ? 30000 : 0;
  G.bonus = { lifeB, bombB, noMiss, base: G.score };
  G.score += lifeB + bombB + noMiss;
  state = 'clear'; endT = 0;
  document.body.classList.remove('playing');
  setMusic('title');
  if (G.score > hiScore) { hiScore = G.score; G.newHi = true; saveHi(); }
}

// ===== 描画：背景 =====
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: i * 120 + hash(i) * 60, y: 30 + hash(i + 9) * 110, s: 0.7 + hash(i + 3) * 0.8 }));
function drawCloud(x, y, s, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(x, y, 14 * s, 0, TAU); ctx.arc(x + 16 * s, y - 8 * s, 17 * s, 0, TAU);
  ctx.arc(x + 34 * s, y, 13 * s, 0, TAU); ctx.arc(x + 16 * s, y + 5 * s, 14 * s, 0, TAU);
  ctx.fill();
}
function drawBG(scroll, k) {
  // 空：ステージが進むと夕焼けに
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, mix('#5fb8ec', '#e9785a', k));
  g.addColorStop(0.65, mix('#bfe6f5', '#ffc07a', k));
  g.addColorStop(1, mix('#fff0c2', '#ffe0a0', k));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 太陽
  const sy = 70 + k * 110;
  ctx.fillStyle = `rgba(255,248,210,${0.35 - k * 0.1})`;
  circ(520, sy, 46);
  ctx.fillStyle = mix('#fffbe6', '#ffd27a', k);
  circ(520, sy, 28);
  // 雲
  for (const c of CLOUDS) {
    const x = ((c.x - scroll * 0.15) % (W + 160) + W + 160) % (W + 160) - 80;
    drawCloud(x, c.y, c.s, `rgba(255,255,255,${0.85 - k * 0.25})`);
  }
  // 遠い山
  const hill = (off, base, amp, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const wx = x + off;
      ctx.lineTo(x, base - (Math.sin(wx * 0.009) * amp + Math.sin(wx * 0.023 + 1) * amp * 0.5 + Math.sin(wx * 0.051) * amp * 0.15));
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  };
  hill(scroll * 0.2, 225, 34, mix('#9cc9c9', '#b48aa0', k));
  hill(scroll * 0.4 + 900, 262, 26, mix('#6fa98a', '#7b6f7e', k));
  // 森
  const off = scroll * 0.75, step = 38;
  const i0 = Math.floor(off / step) - 1;
  for (let i = i0; i < i0 + W / step + 3; i++) {
    const x = i * step - off + hash(i) * 16, h = 30 + hash(i + 5) * 36;
    const base = GROUND + 4;
    ctx.fillStyle = mix('#5b3a26', '#4a2e22', k);
    ctx.fillRect(x - 3, base - h * 0.5, 6, h * 0.5);
    const tc = hash(i + 2) > 0.5 ? mix('#2f6b4f', '#3b4b45', k) : mix('#3d7d52', '#44564a', k);
    circ(x, base - h * 0.62, h * 0.34, tc);
    circ(x - h * 0.2, base - h * 0.45, h * 0.26, tc);
    circ(x + h * 0.2, base - h * 0.47, h * 0.27, tc);
    if (hash(i + 17) > 0.86) { // 木にぶら下がる蜂の巣
      ell(x + h * 0.22, base - h * 0.3, 5, 7, '#f6b21a');
      ctx.fillStyle = '#c98a0a'; ctx.fillRect(x + h * 0.22 - 5, base - h * 0.3, 10, 1.5);
    }
  }
  // 地面
  ctx.fillStyle = mix('#7cc25a', '#8a9a55', k);
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = mix('#5a9c4a', '#6d7a45', k);
  ctx.fillRect(0, GROUND + 8, W, H - GROUND);
  ctx.fillStyle = mix('#8a6a45', '#6f5440', k);
  ctx.fillRect(0, GROUND + 20, W, H - GROUND);
  // 花と草
  const go = scroll, fs = 23;
  const f0 = Math.floor(go / fs) - 1;
  for (let i = f0; i < f0 + W / fs + 3; i++) {
    const x = i * fs - go, hv = hash(i + 40);
    ctx.fillStyle = mix('#4c8a3c', '#5a6a3c', k);
    ctx.fillRect(x, GROUND - 3, 2, 4); ctx.fillRect(x + 5, GROUND - 5, 2, 6);
    if (hv > 0.62) {
      const fc = hv > 0.85 ? '#fff4d6' : hv > 0.74 ? '#ff8fb1' : '#ffd23f';
      circ(x + 10, GROUND + 6 + hash(i) * 8, 2.4, fc);
      circ(x + 10, GROUND + 6 + hash(i) * 8, 1, '#c98a0a');
    }
  }
}

// ===== 描画：キャラクター =====
function drawPlayer(x, y, t, tilt, flashing = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt * 0.18);
  FL = flashing;
  // マフラー
  ctx.fillStyle = C('#e8453c');
  ctx.beginPath();
  ctx.moveTo(-4, -3);
  for (let i = 0; i <= 5; i++) ctx.lineTo(-6 - i * 5, -3 + Math.sin(t * 16 - i) * 2.4 + i * 0.6);
  for (let i = 5; i >= 0; i--) ctx.lineTo(-6 - i * 5, 2 + Math.sin(t * 16 - i) * 2.4 + i * 0.6);
  ctx.closePath(); ctx.fill();
  // 尾翼
  tri(-20, 2, -30, -10, -14, 2, '#c7322b');
  // 機体
  ell(0, 5, 25, 8.5, '#e8453c');
  ell(2, 7, 20, 4, '#c7322b');
  ctx.fillStyle = C('#fff4d6'); ctx.fillRect(-18, 3, 30, 2);
  // 翼
  ctx.fillStyle = C('#f6b21a');
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, 7, 22, 6, 3) : ctx.rect(-8, 7, 22, 6); ctx.fill();
  // ノーズとプロペラ
  circ(25, 5, 5, '#f6b21a');
  ctx.fillStyle = FL ? '#fff' : 'rgba(255,255,255,.75)';
  ell(30, 5, 2, 3 + 10 * Math.abs(Math.sin(t * 40)));
  // くまの頭
  circ(-4, -17, 4.8, '#8a5a3b'); circ(9, -18, 4.8, '#8a5a3b');
  circ(-4, -17, 2.3, '#d9a066'); circ(9, -18, 2.3, '#d9a066');
  circ(3, -9, 10.5, '#8a5a3b');
  ell(10, -6, 6, 4.6, '#e9c79a');
  circ(14.5, -7.5, 2.2, '#2a1a10');
  circ(8, -11, 1.8, '#2a1a10');
  circ(8.6, -11.6, 0.6, '#ffffff');
  circ(4, -5, 2.2, '#ff9fb0');
  // ゴーグル（おでこ）
  ctx.fillStyle = C('#3a3f4a'); ctx.fillRect(-7, -17, 16, 3);
  circ(5, -16, 3.6, '#3a3f4a'); circ(5, -16, 2.4, '#9fe0ff');
  FL = false;
  ctx.restore();
}
function drawBee(x, y, t, s = 1, hornet = false, flash = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  FL = flash;
  const w = Math.sin(t * 50) * 0.5 + 0.5;
  ctx.fillStyle = FL ? '#fff' : 'rgba(235,250,255,.8)';
  ell(3, -10, 6, 4 + w * 4, null, -0.3); ell(9, -9, 5, 3 + w * 3, null, 0.3);
  tri(13, -1, 21, 2, 13, 4, '#2a1a10');
  const body = hornet ? '#f08a1c' : '#ffd23f';
  ell(5, 1, 10, 7, body);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(5, 1, 10, 7, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = C('#2a1a10'); ctx.fillRect(2, -7, 3, 16); ctx.fillRect(8, -7, 3, 16);
  ctx.restore();
  circ(-6, 0, 6.5, '#2a1a10');
  circ(-8.5, -1.5, 2.4, '#ffffff');

}
function drawCrow(x, y, t, flash) {

  FL = false; ctx.restore();
}
function drawHog(x, y, t, flash) {
  ctx.save(); ctx.translate(x, y); FL = flash;

  }
  ell(0, 4, 14, 10, '#8a6a45');
  ell(-12, 5, 6, 4.5, '#e9c79a');
  circ(-17, 4, 2, '#2a1a10');
  circ(-9, 0, 1.7, '#2a1a10');
  FL = false; ctx.restore();
}
function drawHive(x, y, t, flash) {
  ctx.save(); ctx.translate(x, y); FL = flash;

  circ(0, -42, 13, '#e8453c');
  ctx.fillStyle = FL ? '#fff' : 'rgba(255,255,255,.5)'; ell(-4, -46, 3, 5, null, 0.4);

  ell(0, -1, 14, 6.5, '#ffc93d');
  ell(0, 8, 12, 5.5, '#f6b21a');

}
function drawQueen(b) {
  const flash = b.flash > 0;

  const w = Math.sin(t * 40) * 0.5 + 0.5;

  ell(28, 10, 34, 23, '#f08a1c');
  ctx.save();
  ctx.beginPath(); ctx.ellipse(28, 10, 34, 23, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = C('#2a1a10');
  for (let i = 0; i < 4; i++) ctx.fillRect(10 + i * 13, -20, 6, 60);
  ctx.restore();

  for (let i = 0; i < 3; i++) {

  }
  ell(-8, 0, 19, 17, '#3a2a1c');
  // 頭
  circ(-34, -4, 20, '#f08a1c');
  ell(-44, -9, 7, 9.5, '#2a1a10');
  ell(-26, -11, 6, 8, '#2a1a10');
  const eye = b.ph >= 1 ? '#ff3b3b' : '#ffd23f';
  circ(-45, -11, 2.4, eye); circ(-27, -13, 2, eye);
  // 怒り眉
  ctx.strokeStyle = C('#2a1a10'); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-52, -22); ctx.lineTo(-38, -17); ctx.stroke();
  // 大あご
  const m = Math.sin(t * 8) * 0.25;
  ctx.save(); ctx.translate(-48, 8); ctx.rotate(m);
  tri(0, 0, -12, 4, -2, 7, '#2a1a10'); ctx.restore();
  ctx.save(); ctx.translate(-40, 12); ctx.rotate(-m);
  tri(0, 0, -10, 8, 0, 6, '#2a1a10'); ctx.restore();
  // 王冠
  ctx.fillStyle = C('#ffd23f');
  ctx.beginPath();
  ctx.moveTo(-50, -20); ctx.lineTo(-48, -38); ctx.lineTo(-42, -28); ctx.lineTo(-35, -44);
  ctx.lineTo(-29, -28); ctx.lineTo(-22, -38); ctx.lineTo(-20, -20); ctx.closePath(); ctx.fill();
  circ(-35, -34, 2.5, '#e8453c');
  // 触角
  ctx.strokeStyle = C('#2a1a10'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-44, -20); ctx.quadraticCurveTo(-58, -40, -66, -36); ctx.stroke();
  FL = false;
  ctx.restore();
}
function drawItem(it) {
  const s = 1 + Math.sin(it.t * 6) * 0.08;
  ctx.save(); ctx.translate(it.x, it.y); ctx.scale(s, s);
  ctx.strokeStyle = `rgba(255,244,214,${0.5 + Math.sin(it.t * 8) * 0.3})`; ctx.lineWidth = 2;

    ctx.fillStyle = '#e8453c'; ctx.fillRect(-7, -5, 14, 2);

}
function drawEB(b) {
  if (b.kind === 'sting') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
    ell(0, 0, 13, 4, '#3a1450'); ell(0, 0, 10, 2.2, '#ff6ad5');
    ctx.restore();
    return;
  }
  const pulse = 1 + Math.sin(b.t * 20) * 0.12;
  circ(b.x, b.y, b.r * 1.35 * pulse, b.kind === 'violet' ? 'rgba(160,80,255,.35)' : 'rgba(255,40,120,.35)');
  circ(b.x, b.y, b.r, b.kind === 'violet' ? '#a24dff' : '#ff2f7a');
  circ(b.x, b.y, b.r * 0.5, '#ffffff');
}
function bearIcon(x, y) {
  circ(x - 5, y - 5, 3, '#8a5a3b'); circ(x + 5, y - 5, 3, '#8a5a3b');

}
function potIcon(x, y) {

  ctx.fillStyle = '#fff4d6'; ctx.fillRect(x - 5, y - 6, 10, 3);
}

// ===== 描画：画面 =====
function drawGame() {
  const p = G.player;
  const k = clamp(G.t / 80, 0, 1) * 0.75;
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 12, rnd(-1, 1) * G.shake * 12);
  drawBG(G.scroll, k);

  // ボスの突進予告ライン
  const b = G.boss;
  if (b && b.pat && b.pat.n === 'charge' && b.pat.k === 1) {
    ctx.fillStyle = `rgba(255,60,60,${0.18 + Math.sin(G.t * 30) * 0.1})`;
    ctx.fillRect(0, b.y - 30, W, 60);
  }

  for (const it of G.items) drawItem(it);
  for (const e of G.enemies) {
    const fl = e.flash > 0;
    if (e.type === 'bee') drawBee(e.x, e.y, e.t, 1, false, fl);
    else if (e.type === 'hornet') drawBee(e.x, e.y, e.t, 2.1, true, fl);
    else if (e.type === 'crow') drawCrow(e.x, e.y, e.t, fl);
    else if (e.type === 'hog') drawHog(e.x, e.y, e.t, fl);
    else if (e.type === 'hive') drawHive(e.x, e.y, e.t, fl);
  }
  if (b) drawQueen(b);

  // 自機ショット（はちみつ弾）
  for (const s of G.shots) {
    const a = Math.atan2(s.vy, s.vx);
    ell(s.x, s.y, 8, 3.4, '#ffb000', a);
    ell(s.x + 1, s.y - 0.8, 4, 1.4, '#fff4d6', a);
  }

  if (p.dead <= 0 && !(p.inv > 0 && Math.floor(G.t * 20) % 2 === 0 && !G.outro)) {
    drawPlayer(p.x, p.y, G.t, p.tilt);
    if (controllable()) { circ(p.x, p.y, 3.2, '#ffffff'); ctx.strokeStyle = '#e8453c'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, TAU); ctx.stroke(); }
  }

  // パーティクル
  for (const q of G.parts) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = q.k === 'smoke' ? a * 0.5 : a;
    if (q.k === 'ring') {
      ctx.strokeStyle = q.c; ctx.lineWidth = 3 * a;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1 - a) + 4, 0, TAU); ctx.stroke();
    } else if (q.k === 'smoke') circ(q.x, q.y, q.size * (1.4 - a * 0.4), q.c);
    else circ(q.x, q.y, q.size * (0.4 + a * 0.6), q.c);
  }
  ctx.globalAlpha = 1;

  for (const e of G.eb) drawEB(e);

  // ボム演出
  if (G.bombFx > 0) {
    const r = (1.2 - G.bombFx) * 900;
    ctx.strokeStyle = `rgba(255,210,63,${G.bombFx / 1.2})`;
    ctx.lineWidth = 26 * G.bombFx;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(255,190,40,${G.bombFx * 0.2})`;
    ctx.fillRect(0, 0, W, H);
  }

  for (const q of G.pops) {
    ctx.globalAlpha = 1 - q.t;
    text(q.s, q.x, q.y, 12, q.c, 'center', '#2a1a10', 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash * 1.4})`; ctx.fillRect(0, 0, W, H); }

  drawHUD();

  if (G.warn > 0) drawWarning();
}

function drawHUD() {
  const p = G.player;
  text('SCORE ' + String(G.score).padStart(7, '0'), 12, 16, 14, '#fff4d6', 'left', '#2a1a10', 4);
  text('HI ' + String(Math.max(hiScore, G.score)).padStart(7, '0'), 12, 33, 10, '#ffd23f', 'left', '#2a1a10', 3);
  // 残機・ボム・パワー（地面の帯に表示）
  const y = H - 13;
  for (let i = 0; i < p.lives; i++) bearIcon(16 + i * 17, y);
  const bx = 16 + Math.max(p.lives, 1) * 17 + 10;
  for (let i = 0; i < p.bombs; i++) potIcon(bx + i * 14, y);
  const px = bx + Math.max(p.bombs, 1) * 14 + 12;
  text('POWER', px, y, 10, '#fff4d6', 'left', '#2a1a10', 3);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < p.power ? '#ffd23f' : 'rgba(42,26,16,.55)';
    ctx.fillRect(px + 42 + i * 9, y - 4, 7, 8);
  }
  // 進行度 or ボスの体力
  const b = G.boss;
  if (b) {
    const w = 260, x = (W - w) / 2, yy = 14;
    text('QUEEN HORNET', W / 2, yy - 1, 10, '#fff4d6', 'center', '#2a1a10', 3);
    ctx.fillStyle = '#2a1a10'; ctx.fillRect(x - 2, yy + 7, w + 4, 10);
    ctx.fillStyle = '#5a1a28'; ctx.fillRect(x, yy + 9, w, 6);
    const r = clamp(b.hp / b.max, 0, 1);
    ctx.fillStyle = r > 0.66 ? '#ffd23f' : r > 0.33 ? '#f08a1c' : '#ff3b3b';
    ctx.fillRect(x, yy + 9, w * r, 6);
    ctx.fillStyle = '#2a1a10';
    ctx.fillRect(x + w * 0.33, yy + 9, 1.5, 6); ctx.fillRect(x + w * 0.66, yy + 9, 1.5, 6);
  } else if (!G.outro) {
    const w = 140, x = W / 2 - w / 2, yy = 16;
    ctx.fillStyle = 'rgba(42,26,16,.55)'; ctx.fillRect(x, yy - 2, w, 4);
    const r = clamp(G.t / BOSS_AT, 0, 1);
    ctx.fillStyle = '#fff4d6'; ctx.fillRect(x, yy - 2, w * r, 4);
    bearIcon(x + w * r, yy);
    circ(x + w + 6, yy, 4, '#f08a1c');
  }
}

function drawWarning() {
  const a = Math.min(1, G.warn * 2, (3.4 - G.warn) * 3);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(180,20,30,.28)'; ctx.fillRect(0, 0, W, H);
  for (const yy of [118, 222]) {
    ctx.fillStyle = '#2a1a10'; ctx.fillRect(0, yy, W, 20);
    ctx.fillStyle = '#ffd23f';
    const o = (G.t * 60) % 28;
    for (let x = -28; x < W + 28; x += 28) {
      ctx.beginPath(); ctx.moveTo(x + o, yy + 20); ctx.lineTo(x + o + 12, yy); ctx.lineTo(x + o + 24, yy); ctx.lineTo(x + o + 12, yy + 20); ctx.fill();
    }
  }
  if (Math.floor(G.t * 4) % 2 === 0) text('WARNING', W / 2, 162, 40, '#ff3b3b', 'center', '#fff4d6', 6);
  text('巨大スズメバチ「クイーン・ホーネット」接近中！', W / 2, 196, 14, '#fff4d6', 'center', '#2a1a10', 4);
  ctx.restore();
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(29,43,58,.82)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 10) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.stroke();
}

function drawTitle(dt) {
  titleT += dt;

function drawEnd() {
  const clear = state === 'clear';
  ctx.fillStyle = 'rgba(29,43,58,.55)'; ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 170, 50, 340, 250);
  if (clear) {
    text('STAGE CLEAR!', W / 2, 84, 34, '#ffd23f', 'center', '#2a1a10', 8);
    const bo = G.bonus;
    const rows = [['撃破スコア', bo.base], ['残機ボーナス', bo.lifeB], ['ボムボーナス', bo.bombB], ['ノーミスボーナス', bo.noMiss]];
    rows.forEach(([l, v], i) => {
      const show = endT > 0.3 + i * 0.25;
      if (!show) return;
      text(l, W / 2 - 130, 124 + i * 22, 13, '#fff4d6', 'left', null);
      text(String(v).padStart(7, ' '), W / 2 + 130, 124 + i * 22, 13, v ? '#fff4d6' : '#7f8f9c', 'right', null);
    });
    if (endT > 1.4) {
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 - 130, 210, 260, 1.5);
      text('TOTAL', W / 2 - 130, 228, 16, '#ffd23f', 'left', null);
      text(String(G.score), W / 2 + 130, 228, 18, '#ffd23f', 'right', null);
    }
  } else {
    text('GAME OVER', W / 2, 90, 36, '#ff5c7a', 'center', '#2a1a10', 8);
    text('くまは森へ帰っていった…', W / 2, 130, 14, '#fff4d6', 'center', null);
    text('SCORE', W / 2, 172, 13, '#b9c9d6', 'center', null);
    text(String(G.score), W / 2, 198, 26, '#ffd23f', 'center', null);
  }
  if (G.newHi && endT > 1.4 && Math.floor(endT * 3) % 2 === 0) text('NEW HI SCORE!', W / 2, 256, 14, '#ff8fb1', 'center', null);
  if (endT > 1.2) text(clear ? 'タップでタイトルへ' : 'タップしてタイトルへ', W / 2, 282, 14, '#ffffff', 'center', null);
}

// ===== メインループ =====
let last = performance.now();
function frame(nowT) {
  const dt = Math.min(0.033, Math.max(0, (nowT - last) / 1000));
  last = nowT;
  const s = view.cw * view.dpr / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  if (state === 'title') {
    drawTitle(dt);
  } else if (state === 'play') {
    update(dt);
    if (state === 'play') drawGame();
    else drawGame(), drawEnd();
  } else if (state === 'pause') {
    drawGame();
    ctx.fillStyle = 'rgba(29,43,58,.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSE', W / 2, H / 2 - 14, 34, '#ffd23f', 'center', '#2a1a10', 8);
    text('タップで再開', W / 2, H / 2 + 26, 16, '#fff4d6', 'center', '#2a1a10', 4);
  } else {
    endT += dt;
    G.t += dt; G.scroll += 90 * dt;
    for (const q of G.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    G.parts = G.parts.filter(q => q.life > 0);
    drawGame();
    drawEnd();
  }
  requestAnimationFrame(frame);
}
setMusic('title');
if (document.fonts && document.fonts.load) document.fonts.load('16px "DotGothic16"').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
